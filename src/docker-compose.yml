services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-store}
      POSTGRES_USER: ${DB_USER:-hestia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in src/.env or the environment}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-hestia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in src/.env or the environment}
      DB_NAME: ${DB_NAME:-store}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
